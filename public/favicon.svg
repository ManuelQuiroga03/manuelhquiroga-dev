<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/> <!-- Indigo -->
      <stop offset="50%" stop-color="#8b5cf6"/> <!-- Violet -->
      <stop offset="100%" stop-color="#f43f5e"/> <!-- Rose/Pink -->
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  
  <!-- Glowing border line -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#glowGradient)" stroke-width="16" opacity="0.9"/>
  
  <!-- Left Code Bracket < -->
  <path d="M 120 180 L 50 256 L 120 332" fill="none" stroke="url(#glowGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Code Bracket > -->
  <path d="M 392 180 L 462 256 L 392 332" fill="none" stroke="url(#glowGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Initials "MHQ" -->
  <text 
    x="256" 
    y="288" 
    font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" 
    font-weight="900" 
    font-size="105" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="2"
  >MHQ</text>
  
  <!-- Terminal underscore cursor "_" in pink/rose -->
  <rect x="338" y="260" width="28" height="18" fill="#f43f5e" rx="4"/>
</svg>